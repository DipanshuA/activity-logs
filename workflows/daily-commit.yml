name: Daily Commit

on:
  schedule:
    - cron: '0 6 * * *'   # runs at 11:30 AM IST
    - cron: '0 18 * * *'  # runs at 11:30 PM IST
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make a commit
        run: |
          echo "Updated on $(date)" >> update-log.txt
          git config --global user.name "addy"
          git config --global user.email "addybhardwaj15@gmail.com"
          git add update-log.txt
          git commit -m "Daily update" || echo "No changes to commit"

      - name: Push changes
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
